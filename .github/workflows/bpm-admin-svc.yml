name: bpm-admin-svc

on:
  push:
    paths:
      - 'bpm-admin-svc/**'
      - '.github/workflows/bpm-admin-svc.yml'
  pull_request:
    paths:
      - 'bpm-admin-svc/**'
      - '.github/workflows/bpm-admin-svc.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bpm-admin-svc
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
